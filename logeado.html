<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Eventos Unimagdalena</title>

    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/logeado.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,1,0">
</head>

<body>

    <div id="overlay" class="overlay oculto"></div>

    <aside id="menuUsuario" class="menu-lateral">
        <div class="menu-top">
            <h3>Mi cuenta</h3>
            <button id="cerrarMenu" class="btn-cerrar" type="button">&times;</button>
        </div>

        <a href="mis_eventos.html">Ver mis eventos</a>
        <a href="#">Ver inscripciones</a>
        <a href="#">Ver favoritos</a>
        <a href="#">Mi perfil</a>
        <a href="index.html">Cerrar sesión</a>
    </aside>

    <div class="container">

        <header>

            <div class="header-left">
                <img src="img/logo.png" class="logo" alt="Logo">
                <h1>EVENTOS UNIMAGDALENA</h1>
            </div>

            <button id="userBtn" class="user-button" type="button" aria-label="Usuario">
                <span class="material-symbols-outlined">account_circle</span>
            </button>

        </header>

        <div class="search">

            <input type="text" id="buscar" placeholder="Buscar general...">

            <select id="categoria">
                <option value="todos">Todas las categorías</option>
                <option value="cultura">Cultura</option>
                <option value="lectura">Lectura</option>
                <option value="festival">Festival</option>
            </select>

        </div>

        <section>

            <h2>Eventos actuales</h2>

            <div class="mensaje">

                <p>¡Quédate atento a los próximos eventos!</p>

                <p id="mensajeActual">
                    En el momento no se encuentra abierto ningún evento
                </p>

            </div>

        </section>

        <section>

            <h2>Próximos eventos</h2>

            <div class="eventos" id="proximosEventos"></div>

            <p id="mensajeProximos">No hay eventos registrados</p>

        </section>

        <footer>
            <p>footer</p>
        </footer>

    </div>

    <div id="detalleEvento" class="detalle oculto">

        <h2 id="tituloDetalle"></h2>

        <img id="imgDetalle" alt="Detalle del evento">

        <p id="descDetalle"></p>

        <button onclick="volver()">Volver</button>

    </div>

    <script src="js/script.js"></script>
    <script src="js/logeado.js"></script>

</body>

</html>
