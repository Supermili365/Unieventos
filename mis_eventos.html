<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mis Eventos - Unimagdalena</title>
    <link rel="stylesheet" href="css/mis_eventos.css">
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <header>
            <div class="header-left">
                <img src="img/logo.png" class="logo" alt="Logo">
                <h1>EVENTOS UNIMAGDALENA</h1>
            </div>
        </header>

        <main class="contenido">

            <section class="panel-eventos">
                <div class="panel-titulo">
                    <h2>Gestionar Eventos</h2>
                </div>

                <div class="eventos-grid">

                    <div class="evento agregar-evento">
                        <div class="img-box agregar-box">
                            <span class="mas">+</span>
                        </div>
                        <p>Agregar Evento</p>
                    </div>

                    <div class="evento">
                        <div class="img-box">
                            <img src="img/hackaton.png" alt="Hackaton al lago">
                        </div>
                        <p>¡Hackaton al lago!</p>
                        <div class="acciones">
                            <button class="btn iniciar">Iniciar</button>
                            <button class="btn ver">Ver</button>
                        </div>
                    </div>

                    <div class="evento">
                        <div class="img-box">
                            <img src="img/monitoria.png" alt="Monitoría Cálculo">
                        </div>
                        <p>Monitoría Cálculo</p>
                        <div class="acciones">
                            <button class="btn iniciar">Iniciar</button>
                            <button class="btn ver">Ver</button>
                        </div>
                    </div>

                    <div class="evento">
                        <div class="img-box">
                            <img src="img/futbolito.png" alt="Futbolito">
                        </div>
                        <p>Futbolito</p>
                        <div class="acciones">
                            <button class="btn iniciar">Iniciar</button>
                            <button class="btn ver">Ver</button>
                        </div>
                    </div>

                </div>
            </section>

        </main>

        <footer>
            <p>footer</p>
        </footer>

    </div>

    <script src="js/mis_eventos.js"></script>
</body>

</html>
