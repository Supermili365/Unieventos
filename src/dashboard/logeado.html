<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Eventos Unimagdalena</title>
  <link rel="stylesheet" href="../shared/css/estilosGenerales.css">
  <link rel="stylesheet" href="../home/index.css">
</head>

<body>

  <div id="overlay" class="overlay oculto"></div>
  <aside id="menuUsuario" class="menu-lateral">
  </aside>

  <div class="container">

    <div id="header"></div>
    <div id="breadcrumb"></div>

    <div class="search">
      <input type="text" id="buscar" placeholder="Buscar general...">
      <select id="categoria">
        <option value="todos">Todas las categorías</option>
        <option value="Académico">Académico</option>
        <option value="Cultura">Cultura</option>
        <option value="Lectura">Lectura</option>
        <option value="Festival">Festival</option>
        <option value="Deportivo">Deportivo</option>
        <option value="Social">Social</option>
        <option value="Tecnologico">Tecnologico</option>
        <option value="Bienestar">Bienestar</option>
      </select>
    </div>

    <section>
      <h2>Eventos actuales</h2>
      <div class="eventos" id="eventosActuales"></div>
      <p id="mensajeActuales">No hay eventos registrados</p>
    </section>

    <section>
      <h2>Próximos eventos</h2>
      <div class="eventos" id="proximosEventos"></div>
      <p id="mensajeProximos">No hay eventos registrados</p>
    </section>

    <section>
      <h2>Eventos Asistidos</h2>
      <div class="mensaje">
        <p>¡Quédate atento a los eventos!</p>
        <p id="mensajeActual">Hasta el momento no has asistido a ningún evento</p>
      </div>
    </section>

    <div id="footer"></div>

  </div>

  <div id="detalleEvento" class="detalle oculto">
    <h2 id="tituloDetalle"></h2>
    <img id="imgDetalle" alt="Detalle del evento">
    <p id="descDetalle"></p>
    <button onclick="volver()">Volver</button>
  </div>

  <script src="logeado.js"></script>
  <script src="../shared/components/components.js"></script>
  <script>
    Components.loadHeader(
      '../shared/img/logo.png',
      `<button id="userBtn" class="user-button" type="button" aria-label="Usuario">
         <span class="material-symbols-outlined">account_circle</span>
       </button>`
    );
    Components.loadMenuUsuario();
    Components.loadBreadcrumb([{ label: 'Inicio' }]);
    Components.loadFooter();
  </script>

</body>

</html>
