        <div class="eventos-grid grid-eventos">

    <div id="footer"></div>

  <div id="modalOverlay" class="modal-overlay hidden"></div>
  <div id="modalEvento" class="modal hidden">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modalTitulo">Evento</h2>
        <button id="cerrarModal" class="btn-close">&times;</button>
      </header>
      <div class="modal-body">
        <div class="modal-inner">
          <div id="modalPortada" class="modal-img"></div>
          <div class="modal-main-info">
            <div id="descContainer">
              <h3>Descripción</h3>
              <p id="modalDesc"></p>
            </div>
            <div id="qrContainer" class="hidden">
              <h3>QR Pre-registro</h3>
              <div class="qr-wrapper">
                <span class="material-symbols-outlined qr-icon">qr_code_2</span>
                <p>Escanea para registrarte</p>
              </div>
            </div>
            <div class="modal-grid">
              <div class="modal-section">
                <h4>Horarios</h4>
                <ul id="modalHorarios" class="modal-list"></ul>
              </div>
              <div class="modal-section">
                <h4>Preinscritos</h4>
                <ul id="modalPreinscritos" class="modal-list"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
      <footer class="modal-footer">
        <div class="footer-left">
          <button id="btnModificar" class="btn ver">Modificar</button>
          <button id="btnEliminar" class="btn-danger">Eliminar</button>
          <button id="btnIniciar" class="btn iniciar">Iniciar</button>
        </div>
        <button id="btnToggleQR" class="btn blanco">
          <div class="qr-box">
            <span class="material-symbols-outlined">qr_code_2</span>
          </div>
        </button>
      </footer>
    </div>
  </div>
