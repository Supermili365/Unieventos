<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unimag Eventos</title>

<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/login.css">
</head>

<body>

<div class="login-container">

    <div class="header">

        <div class="logo-container">
            <img src="img/Escudo_unimag_sm.png" alt="Escudo Universidad">
        </div>

    </div>

    <div class="form-section">

        <h2>Unimag Eventos</h2>

        <form id="formLogin">
            <input type="email" placeholder="tucorreo@unimagdalena.edu.co">
            <input type="password" placeholder="contraseña">

            <button type="submit">Iniciar Sesión</button>
        </form>

        <a href="index.html" class="guest-link">Continuar como invitado</a>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
